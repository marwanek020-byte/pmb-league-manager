name: Build PMB Manager APK

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'capacitor.config.ts'
      - 'android/**'
      - 'public/**'
      - '.github/workflows/build-manager-apk.yml'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: "true"
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/PMB-Manager.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PMB-Manager-APK
          path: release-output/PMB-Manager.apk
          retention-days: 30
