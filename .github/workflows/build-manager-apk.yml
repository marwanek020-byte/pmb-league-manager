name: Build PMB Manager APK

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: "true"
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Sync Capacitor Android
        run: |
          ./node_modules/.bin/cap sync android || npx --yes @capacitor/cli sync android || echo "Capacitor sync completed/skipped, using pre-bundled assets"

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "### Gradle Build Error" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Rename APK for Distribution
        run: |
          mkdir -p release-output
          APK_PATH=$(find android -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release-output/PMB-Manager.apk
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PMB-Manager-APK
          path: release-output/PMB-Manager.apk
          retention-days: 30
