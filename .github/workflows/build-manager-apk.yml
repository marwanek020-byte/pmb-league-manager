name: Build PMB Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: "true"
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Sync Capacitor Android
        run: |
          ./node_modules/.bin/cap sync android || npx --yes @capacitor/cli sync android || echo "Capacitor sync completed/skipped, using pre-bundled assets"

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Accept Android SDK Licenses & Install Platform
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "platforms;android-36" || true

      - name: Build Android APK (verbose)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee gradle-build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "### Gradle Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $GRADLE_EXIT
          fi

      - name: Locate and Package APK
        run: |
          mkdir -p release-output
          echo "=== SEARCHING FOR COMPILED APK ==="
          find . -name "*.apk"
          find android -name "*.apk" -exec cp {} release-output/PMB-Manager.apk \; || true
          ls -la release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PMB-Manager-APK
          path: |
            release-output/PMB-Manager.apk
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/**/*.apk
          retention-days: 30
