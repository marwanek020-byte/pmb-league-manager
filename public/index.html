<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PMB Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07070a;
      color: #e9c349;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .logo {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 11px;
      letter-spacing: 0.25em;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(233,195,73,0.2);
      border-top-color: #e9c349;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo">PMB</div>
  <div class="sub">PES MOROCCAN BOURGEOIS</div>
  <div class="spinner"></div>
</body>
</html>
